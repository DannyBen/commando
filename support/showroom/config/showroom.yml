# Configuration paths are relative to this file.
# Each Ruby scenario runs against every theme below.
workspace: workspace.yml
output: ../out

capture:
  width: 960
  height: 540
  themes:
    - light
    - dark
  # Controlled UI time makes dates and animation captures repeatable.
  start_time: '2026-10-17T12:00:00Z'

# Video uses existing PNGs and the matching movies/SCENE.rb timeline here.
# Durations are rounded to the nearest frame. Encoding is silent, with cuts.
# The master uses lossless FFV1/RGB; the preview uses H.264 for web playback.
video:
  fps: 30
  preview_crf: 18
  preview_preset: medium

# GIF uses an existing master.mkv; it never recaptures or rebuilds videos.
# Gifski preserves the capture width and loops the animation indefinitely.
gif:
  fps: 10
  quality: 90

# Initial UI state, reset before each run of a scenario in a theme.
# Panel order is left to right. Names refer to immediate children of the folder.
# Parent rows are generated by the app; they are not workspace entries.
# Omitted selected means the first ordinary entry; omitted marked means none.
panels:
  - folder: 'C:\Projects'
    selected: commando
    marked:
      - commando
      - website
  - folder: 'D:\Downloads'
    selected: reference.png
  - folder: 'E:\Archive\2026'
    selected: october

# One-based panel number, matching Commando's visible panel numbering.
active_panel: 1

# Actions, waits and screenshot names belong in the Ruby scenario DSL.
# These files define only workspace content, capture settings and initial state.
