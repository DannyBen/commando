## Core

run: go run . "$@"
#? open the Commando folder browser
#$ [PATH ...]

build-windows: scripts/build-windows
#? build a Windows GUI executable in dist/

preview:
  mkdir -p tmp/agent/screenshots
  go run . --png tmp/agent/screenshots/preview.png
#? render the sample workspace to a PNG

## Testing & Linting

test: go test ./... "$@"
#? run tests

loc: scripts/loc
#? count Go source lines separately for code and tests

fmt: gofmt -w .
#? format Go code

vet: go vet ./...
#? check for suspicious code and likely mistakes

check:
  gofmt -w .
  go vet ./...
  go test ./...
#? format, vet, and test everything

## Dependencies

tidy: go mod tidy
#? clean up and sync dependencies

verify: go mod verify
#? verify downloaded dependencies

## Releases

release-check: goreleaser check
#? validate the release configuration

release-snapshot: goreleaser release --snapshot --clean --parallelism 1
#? build local release archives without publishing
