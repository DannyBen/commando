## Core

run: go run -ldflags="-X github.com/dannyben/commando/internal/app.version=$(go run ./tools/build-version.go)" . "$@"
#? open the Commando folder browser
#$ [PATH ...]

build-windows: scripts/build-windows
#? build a Windows GUI executable in dist/

preview:
  mkdir -p tmp/agent/screenshots
  go run -ldflags="-X github.com/dannyben/commando/internal/app.version=$(go run ./tools/build-version.go)" . --png tmp/agent/screenshots/preview.png
#? render the sample workspace to a PNG

## Testing & Linting

test: go test ./... "$@"
#? run tests

help-audit: COMMANDO_HELP_AUDIT=1 COMMANDO_HELP_AREA="${1:-}" go test ./internal/app -run '^TestHelpCoverage$' -count=1 -v
#? report missing help; exit nonzero until the selected area is complete
#$ [AREA]

loc: scripts/loc
#? count Go source lines separately for code and tests

fmt: gofmt -w .
#? format Go code

vet: go vet ./...
#? check for suspicious code and likely mistakes

check:
  gofmt -w .
  go vet ./...
  go test ./...
#? format, vet, and test everything

## Dependencies

tidy: go mod tidy
#? clean up and sync dependencies

verify: go mod verify
#? verify downloaded dependencies

## Releases

release-check: goreleaser check
#? validate the release configuration

release-snapshot: goreleaser release --snapshot --clean --parallelism 1
#? build local release archives without publishing

## Development

codex: codex --add-dir /vagrant/uss
#? run codex with USS dirs