## Core

run: go run . "$@"
#? open the Commando folder browser
#$ [PATH ...]

build-windows: scripts/build-windows
#? build a Windows GUI executable in dist/

preview:
  mkdir -p tmp
  go run . --png tmp/preview.png
#? render the sample workspace to a PNG

## Testing & Linting

test: go test ./... "$@"
#? run tests

fmt: gofmt -w .
#? format Go code

vet: go vet ./...
#? check for suspicious code and likely mistakes

check:
  gofmt -w .
  go vet ./...
  go test ./...
#? format, vet, and test everything

## Dependencies

tidy: go mod tidy
#? clean up and sync dependencies

verify: go mod verify
#? verify downloaded dependencies
