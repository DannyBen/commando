# Numeric levels are cumulative: 1 errors, 2 warnings, 3 notifications,
# 4 interactions, 5 navigation. Off is 0; All bypasses the level comparison.
# Notes are Hz; timings are milliseconds; volume is a percentage before master
# volume. Spacing is measured between note starts. Edit and rebuild to tune.

[sounds.navigation]
level = 5
file = "tick.json"
notes = [220]
length_ms = 12
waveform = "square"
volume = 10

[sounds.directoryNavigation]
level = 5
file = "dir-change.json"
notes = [523.25]
length_ms = 75
waveform = "triangle"
volume = 32

