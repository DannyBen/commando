# Numeric levels are cumulative: 1 errors, 2 warnings, 3 notifications,
# 4 interactions, 5 navigation. Off is 0; All bypasses the level comparison.

[sounds.navigation]
level = 5
file = "tick.json"

[sounds.directoryNavigation]
level = 5
file = "dir-change.json"

[sounds.messageInfo]
level = 3
file = "message-info.json"

[sounds.messageSuccess]
level = 3
file = "message-success.json"

[sounds.messageWarning]
level = 2
file = "message-warning.json"

[sounds.messageError]
level = 1
file = "message-error.json"

# Panel sizes 0.6, 0.8, 1, 1.2, 1.5 and 2 select indices -2 through 3.
[sounds.panelSize06]
level = 4
file = "panel-size.json"
inputs = { index = "-2" }

[sounds.panelSize08]
level = 4
file = "panel-size.json"
inputs = { index = "-1" }

[sounds.panelSize10]
level = 4
file = "panel-size.json"
inputs = { index = "0" }

[sounds.panelSize12]
level = 4
file = "panel-size.json"
inputs = { index = "1" }

[sounds.panelSize15]
level = 4
file = "panel-size.json"
inputs = { index = "2" }

[sounds.panelSize20]
level = 4
file = "panel-size.json"
inputs = { index = "3" }

[sounds.click]
level = 4

[sounds.enabled]
level = 4
file = "enable-disable.json"
inputs = { direction = "up" }

[sounds.disabled]
level = 4
file = "enable-disable.json"
inputs = { direction = "down" }

[sounds.opened]
level = 4
file = "open-close.json"
inputs = { direction = "up" }

[sounds.closed]
level = 4
file = "open-close.json"
inputs = { direction = "down" }
