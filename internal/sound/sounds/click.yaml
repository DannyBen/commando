parameters:
  note:
    default: A3
    range: [C2, C8]
  attack:
    default: 2ms
    range: [0ms, 10ms]
    step: 1ms
  decay:
    default: 10ms
    range: [1ms, 100ms]
    step: 1ms
  level:
    default: 0.1
    range: [0, 1]
    step: 0.01
    locked: true

voices:
  tone:
    note: $note
    waveform: sine
    level: $level
    envelope:
      type: segments
      segments:
        - {duration: $attack, level: 1}
        - {duration: $decay, level: 0}
        - {duration: 1ms, level: 0}
