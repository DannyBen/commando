parameters:
  root:
    default: D4
    range: [C3, C6]
  waveform:
    default: triangle
    choices: [sine, triangle, square, saw]
  index:
    default: "0"
    choices:
      "-2": -5st
      "-1": -3st
      "0": 0st
      "1": 2st
      "2": 4st
      "3": 7st

  level:
    default: 0.28
    range: [0, 1]
    step: 0.01
    locked: true

voices:
  tone:
    note: $root
    transpose: $index
    waveform: $waveform
    level: $level
    envelope:
      attack: 5ms
      decay: 30ms
 
