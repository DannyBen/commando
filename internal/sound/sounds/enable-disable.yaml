parameters: 
  direction:
    default: up
    choices: 
      up: [C6, B6]
      down: [B6, C6]
  spacing:
    default: 60ms
    range: [40ms, 80ms]
    step: 5ms

voices: 
  tone:
    note: C5
    unison: 
      spread: 18ct
      voices: 2
    envelope: 
      attack: {duration: 5ms, curve: 3}
      hold: 10ms
      decay: {duration: 50ms, curve: -3}

sequence: 
  voice: tone
  events: $direction
  spacing: $spacing
  level: 
    from: 0.1
    to: 0.2
