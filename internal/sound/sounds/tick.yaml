parameters:
  note:
    default: A5
    range: [C2, C8]
  attack:
    default: 10ms
    range: [0ms, 10ms]
  body:
    label: Decay duration
    default: 50ms
    range: [10ms, 100ms]
    step: 10ms
  level:
    default: 0.06
    range: [0, 0.2]
    step: 0.005
    locked: true

voices:
  tone:
    note: $note
    waveform: sine
    level: $level
    envelope:
      attack: {duration: $attack, curve: 5}
      decay: {duration: $body, curve: -6}
