parameters:
  direction:
    default: up
    choices:
      up: [$note1, $note2]
      down: [$note2, $note1]
  note1:
    default: G3
    range: [C2, C8]
  note2:
    default: G4
    range: [C2, C8]
  spacing:
    default: 180ms
    range: [80ms, 250ms]
    step: 10ms

voices:
  tone:
    waveform: sine
    envelope: &envelope
      attack: 5ms
      hold: 50ms
      decay: 10ms

sequence:
  voice: tone
  events: $direction
  spacing: $spacing
