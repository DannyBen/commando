# Bounds use source * scale + offset. Equal endpoints give an exact relation.
# A missing component remains independent, even when the color's link is on.
[alt_background.lightness]
source = "background"
scale = [1.0, 1.0]
offset = [-0.12, 0.12]
[alt_background.chroma]
source = "background"
scale = [1.0, 1.0]
offset = [-0.02, 0.02]
[alt_background.hue]
source = "background"
scale = [1.0, 1.0]
offset = [-20.0, 20.0]

