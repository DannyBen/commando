# Embedded defaults. User settings.toml contains explicit value overrides only.
[appearance.autocolor]
enabled = true
lightness = 0.36
chroma = 0.35
hue = 20.0

[appearance.autocolor.selection]
lightness_offset = 0.10

[appearance.autocolor.special_files]
hidden_lightness_offset = 0.06
hidden_chroma_multiplier = 0.65
dotfile_lightness_offset = 0.03
dotfile_chroma_multiplier = 0.80

[appearance.font]
family = "Victor Mono"
text_size = 15.0
small_text_size = 12.0
weight = 600.0

[view]
show_protected_system_files = false

[application.data_folder]
path = ""

# Item template. No editor rules are installed by default.
[[programs.editors]]
ext = []
path = ""
args = "%SelectedFiles%"

[feedback.sounds]
enabled = true

[feedback.notifications]
animation = true
