# Embedded defaults. User settings.toml contains explicit value overrides only.
[appearance.contrast_guard]
enabled = true

[appearance.icons]
enabled = true
original_color = 80

[appearance.theme.generator]
mode = "Light"
seed = 1.0
vibrance = 50.0
dynamics = 35.0
color_shift = 0.0

[appearance.theme.colors.background]
lightness = 100
saturation = 0
hue = 0.0

[appearance.theme.colors.alt_background]
lightness = 90
saturation = 0
hue = 0.0

[appearance.theme.colors.border]
lightness = 65
saturation = 32
hue = 265.0

[appearance.theme.colors.edge]
lightness = 50
saturation = 71
hue = 265.0

[appearance.theme.colors.text]
lightness = 20
saturation = 15
hue = 255.0

[appearance.theme.colors.secondary_text]
lightness = 40
saturation = 8
hue = 255.0

[appearance.theme.colors.text_selection]
lightness = 85
saturation = 100
hue = 265.0

[appearance.theme.colors.selection]
lightness = 55
saturation = 89
hue = 260.0


[appearance.theme.colors.error]
lightness = 55
saturation = 72
hue = 25.0

[appearance.theme.colors.info]
lightness = 55
saturation = 88
hue = 255.0

[appearance.theme.colors.success]
lightness = 55
saturation = 92
hue = 145.0

[appearance.theme.colors.warning]
lightness = 55
saturation = 100
hue = 75.0

[appearance.autocolor]
enabled = true
salt = 0

[appearance.autocolor.lsh]
lightness = 36
saturation = 100

[appearance.autocolor.selection]
lightness_points = 10
cut_lightness_points = 20

[appearance.autocolor.special_files]
hidden_lightness_points = 6
hidden_saturation_multiplier = 0.65
dotfile_lightness_points = 3
dotfile_saturation_multiplier = 0.80

[appearance.font]
family = "Victor Mono"
text_size = 15.0
small_text_size = 12.0
weight = 600.0
bold_weight = 600.0

[appearance.padding.vertical]
rows = 2.0
headers_footers = 6.0
location = 6.0
search = 8.0

[appearance.padding.horizontal]
content = 14.0

[view]
show_protected_system_files = false
show_parent_entry = false

[view.metadata_columns]
extension = true
size = true
modified = true
created = false

[application.data_folder]
path = ""

# Item template. No editor rules are installed by default.
[[programs.editors]]
id = ""
ext = []
path = ""
args = "%SelectedFiles%"

[feedback.sounds]
enabled = true
profile = -1
master_volume = 50

[feedback.notifications]
animation = true


[guards.recycle_confirmation]
single_files = "OFF"
directories = "OFF"
multiple_entries = "OFF"

[guards.delete_confirmation]
single_files = "ON (Cancel default)"
directories = "ON (Cancel default)"
multiple_entries = "ON (Cancel default)"
