# Labels name categories and options. Titles declare settings widgets.
# A widget's palette name defaults to its label; palette can override it.
# visible = false hides a node and its descendants from settings UI only.
[appearance]
label = "Appearance"

[appearance.autocolor]
label = "Auto color"
title = "Auto color"

[appearance.autocolor.lightness]
label = "Lightness"
description = "Adjust the lightness of generated file colors."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

[appearance.autocolor.chroma]
label = "Chroma"
description = "Adjust the color intensity of generated file colors."
control = "stepper-progress"
min = 0.0
max = 0.5
step = 0.01

[appearance.autocolor.hue]
label = "Initial hue"
description = "Rotate the generated file color palette."
control = "stepper-progress"
min = 0.0
max = 360.0
step = 1.0

[view]
label = "View"

[view.show_protected_system_files]
palette = "System files"
title = "System files"
label = "Show protected system entries"
description = "Include entries with both hidden and system attributes."
control = "toggle"

[application]
label = "Application"

[application.data_folder]
label = "Data folder"
title = "Data folder"

[application.data_folder.path]
label = "Folder"
description = "Copy application data to this folder without replacing existing files. Restart Commando to use it."
control = "folder"
