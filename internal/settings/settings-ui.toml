# Labels name categories and options. Titles declare settings widgets.
# A widget's palette name defaults to its label; palette can override it.
# visible = false hides a node and its descendants from settings UI only.
[appearance]
label = "Appearance"

[appearance.autocolor]
label = "Auto color"
title = "Auto color"

[appearance.autocolor.enabled]
label = "Enabled"
description = "Use generated file and selection colors."
control = "toggle"

[appearance.autocolor.lightness]
label = "Lightness"
description = "Adjust the lightness of generated file colors."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

[appearance.autocolor.chroma]
label = "Chroma"
description = "Adjust the color intensity of generated file colors."
control = "stepper-progress"
min = 0.0
max = 0.5
step = 0.01

[appearance.autocolor.hue]
label = "Initial hue"
description = "Rotate the generated file color palette."
control = "stepper-progress"
min = 0.0
max = 360.0
step = 1.0

[view]
label = "View"

[view.show_protected_system_files]
palette = "System files"
title = "System files"
label = "Show protected system entries"
description = "Include entries with both hidden and system attributes."
control = "toggle"

[application]
label = "Application"

[application.data_folder]
label = "Data folder"
title = "Data folder"

[application.data_folder.path]
label = "Folder"
description = "Copy application data to this folder without replacing existing files. Restart Commando to use it."
control = "folder"

[programs]
label = "Programs"

[programs.editors]
label = "Editors"
title = "Editors"

[programs.editors.ext]
label = "Extensions"
description = "Space-separated extensions, or * for the fallback editor."
control = "input"

[programs.editors.path]
label = "Program"
description = "Choose the editor executable."
control = "file"

[programs.editors.args]
label = "Arg"
description = "%SelectedFiles% passes each matching file as a separate argument."
control = "input"

[feedback]
label = "Feedback"

[feedback.sounds]
label = "Sounds"
title = "Sounds"

[feedback.sounds.enabled]
label = "Enabled"
description = "Play application sounds."
control = "toggle"

[feedback.notifications]
label = "Notifications"
title = "Notifications"

[feedback.notifications.animation]
label = "Animation"
description = "Animate notification text and cursor."
control = "toggle"
