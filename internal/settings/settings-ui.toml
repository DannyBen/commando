# Labels name categories and options. Titles declare settings widgets.
# A widget's palette name defaults to its label; palette can override it.
# visible = false hides a node and its descendants from settings UI only.
[appearance]
label = "Appearance"

[appearance.autocolor]
label = "Auto color"
title = "Auto color"

[appearance.autocolor.enabled]
label = "Enabled"
description = "Use generated file and selection colors."
control = "toggle"

[appearance.autocolor.lightness]
label = "Lightness"
description = "Adjust the lightness of generated file colors."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

[appearance.autocolor.chroma]
label = "Chroma"
description = "Adjust the color intensity of generated file colors."
control = "stepper-progress"
min = 0.0
max = 0.5
step = 0.01

[appearance.autocolor.salt]
label = "Salt"
description = "Choose a repeatable set of generated file colors."
control = "stepper"
min = 0.0
step = 1.0
integer = true

[appearance.autocolor.selection]
label = "Selection"
title = "Selection"

[appearance.autocolor.selection.lightness_offset]
label = "Lightness offset"
description = "Adjust selection background lightness relative to its file color."
control = "stepper-progress"
min = -1.0
max = 1.0
step = 0.01

[appearance.autocolor.special_files]
label = "Special files"
title = "Special files"

[appearance.autocolor.special_files.hidden_lightness_offset]
label = "Hidden lightness offset"
description = "Add to generated lightness for entries with the hidden attribute."
control = "stepper-progress"
min = -1.0
max = 1.0
step = 0.01

[appearance.autocolor.special_files.hidden_chroma_multiplier]
label = "Hidden chroma multiplier"
description = "Multiply generated chroma for entries with the hidden attribute."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

[appearance.autocolor.special_files.dotfile_lightness_offset]
label = "Dotfile lightness offset"
description = "Add to generated lightness for entries whose names start with a dot."
control = "stepper-progress"
min = -1.0
max = 1.0
step = 0.01

[appearance.autocolor.special_files.dotfile_chroma_multiplier]
label = "Dotfile chroma multiplier"
description = "Multiply generated chroma for entries whose names start with a dot."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

