# Parent sections define palette groups; leaf sections describe controls.
[appearance]
label = "Appearance"

[appearance.filenames]
label = "Colors"

[appearance.filenames.lightness]
label = "Lightness"
description = "Adjust the lightness of filename colors."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

[appearance.filenames.chroma]
label = "Chroma"
description = "Adjust the color intensity of filenames."
control = "stepper-progress"
min = 0.0
max = 0.5
step = 0.01

[appearance.filenames.hue]
label = "Initial hue"
description = "Rotate the filename color palette."
control = "stepper-progress"
min = 0.0
max = 360.0
step = 1.0

[files]
label = "Files"

[files.show_protected_system]
label = "Show protected system entries"
description = "Include entries with both hidden and system attributes."
control = "toggle"

[storage]
label = "Storage"

[storage.data_folder]
label = "Data folder"
description = "Browse another panel to choose a folder. Preview only; application data stays in its current location."
control = "folder"
