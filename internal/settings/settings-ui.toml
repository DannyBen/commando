# Labels name categories and options. Titles declare settings widgets.
# A widget's palette name defaults to its label; palette can override it.
# visible = false hides a node and its descendants from settings UI only.
[appearance]
label = "Appearance"

[appearance.autocolor]
label = "Auto color"
title = "Auto color"

[appearance.autocolor.enabled]
label = "Enabled"
description = "Use generated file and selection colors."
control = "toggle"

[appearance.autocolor.lsh]
label = "LSH"

[appearance.autocolor.lsh.lightness]
label = "Lightness"
description = "Adjust the lightness of generated file colors."
control = "stepper-progress"
min = 0.0
max = 100.0
step = 1.0

[appearance.autocolor.lsh.saturation]
label = "Saturation"
description = "Adjust the percentage of usable chroma of generated file colors."
control = "stepper-progress"
min = 0.0
max = 100.0
step = 1.0

[appearance.autocolor.salt]
label = "Salt"
description = "Choose a repeatable set of generated file colors."
control = "stepper"
min = 0.0
step = 1.0
integer = true

[appearance.autocolor.selection]
label = "Selection"
title = "Selection"

[appearance.autocolor.selection.lightness_points]
label = "Background lightness offset"
description = "Adjust selection background lightness relative to its file color."
control = "stepper-progress"
min = -100.0
max = 100.0
step = 1.0

[appearance.autocolor.selection.cut_lightness_points]
label = "Cut entries lightness offset"
description = "Adjust cut entries relative to their normal color, including when Auto color is disabled."
control = "stepper-progress"
min = -100.0
max = 100.0
step = 1.0

[appearance.autocolor.special_files]
label = "Special files"
title = "Special files"

[appearance.autocolor.special_files.hidden_lightness_points]
label = "Hidden lightness offset"
description = "Add to generated lightness for entries with the hidden attribute."
control = "stepper-progress"
min = -100.0
max = 100.0
step = 1.0

[appearance.autocolor.special_files.hidden_saturation_multiplier]
label = "Hidden saturation multiplier"
description = "Multiply generated saturation for entries with the hidden attribute."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

[appearance.autocolor.special_files.dotfile_lightness_points]
label = "Dotfile lightness offset"
description = "Add to generated lightness for entries whose names start with a dot."
control = "stepper-progress"
min = -100.0
max = 100.0
step = 1.0

[appearance.autocolor.special_files.dotfile_saturation_multiplier]
label = "Dotfile saturation multiplier"
description = "Multiply generated saturation for entries whose names start with a dot."
control = "stepper-progress"
min = 0.0
max = 1.0
step = 0.01

