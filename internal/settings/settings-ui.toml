control = "stepper"
min = 0.0
step = 1.0
integer = true

[view]
label = "View"

[view.show_protected_system_files]
palette = "System files"
title = "System files"
label = "Show protected system entries"
description = "Include entries with both hidden and system attributes."
control = "toggle"

[application]
label = "Application"

[application.data_folder]
label = "Data folder"
title = "Data folder"

[application.data_folder.path]
label = "Folder"
description = "Copy application data to this folder without replacing existing files. Restart Commando to use it."
control = "folder"

[programs]
label = "Programs"

[programs.editors]
identity = "id"
label = "Editors"
