# One or two lines per context. Quoted dotted IDs are flat catalogue keys.
# [key:command.id] displays the command's first assigned shortcut in key style.
# Ordinary brackets are literal text. Edit and rebuild to change this catalogue.
# Context candidates are supplied by helpContextIDs in interaction.go.
# Missing entries fall back to the enclosing context, then to "help".

