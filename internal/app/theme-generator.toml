# LSH recipe (OKLCH internally). Edit this file and rebuild to change the generator.
# Each variation advances several sine waves at different periods (in steps).
# L/S/H values use lightness points, percentage of usable chroma, and degrees.
# Their amplitude grows from minimum_strength to 1 over growth_period steps,
# then returns to tame. hue_period controls the slower shared hue rotation.
[scale]
growth_period = 720.0
minimum_strength = 0.45
hue_period = 180.0
# Colorfulness scales saturation; surfaces respond more gently than foregrounds.
background_colorfulness_exponent = 0.4
# A curved response leaves useful room for both restrained and vivid palettes.
colorfulness_exponent = 1.5

[files]
# Selection moves toward text; cut/hidden/dotfile offsets move toward background.
selection_offset = 8
saturation = 80
cut_offset = 20
hidden_offset = 6
dotfile_offset = 3

# Offsets point toward the text: positive in Dark/Midtone, negative in Light.
# Filename lightness also follows the mode; Auto color's enabled choice stays.
[modes.Dark]
lightness_wave_multiplier = 1.0
background = 30
text = 94
direction = 1.0
filename = 80

[modes.Midtone]
# Keep middle surfaces close enough to share readable text colors.
lightness_wave_multiplier = 0.25
background = 42
text = 98
direction = 1.0
filename = 90

[modes.Light]
lightness_wave_multiplier = 1.0
background = 85
text = 22
direction = -1.0
filename = 30

# Colors use a previously defined base (or mode_background / mode_text).
# Background controls the main and alternate surfaces.
# Foreground controls border, accents, selections, text and feedback colors.
# Inherited base colors and contrast corrections can link the two families.
# input selects the Background or Foreground variation control.
# wave = sin(2π × (input + phase) / period) × growing strength.
# Lightness offsets/waves follow the mode direction; hue is always degrees.
# Omitted offsets/waves are zero; omitted saturation inherits the base's saturation.
# L/S and their offsets use 0–100 points; H uses degrees.
# Text is adjusted afterward for contrast against its actual backgrounds.
[[colors]]
name = "background"
base = "mode_background"
input = "background"
saturation = 7.2
saturation_wave = 10.5
hue_offset = 250.0
hue_wave = 35.0
lightness_wave = 10
period = 31.0

[[colors]]
name = "alt_background"
base = "background"
input = "background"
lightness_offset = 3.5
lightness_wave = 2.5
saturation_wave = 7.5
hue_wave = 100.0
period = 17.0
phase = 7.0

[[colors]]
name = "border"
base = "background"
input = "foreground"
lightness_offset = 25
lightness_wave = 16
saturation = 52
hue_wave = 150.0
period = 29.0
phase = 11.0
saturation_wave = 30

[[colors]]
