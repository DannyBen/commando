# LSH theme recipe (OKLCH internally). Edit and rebuild to change the generator.
# Each color inherits a baseline and receives stable seeded random adjustments.
# L/S use 0–100 points; H uses degrees.
#
# User controls (saved in normal settings, not configured here):
#   Seed: positive integer; chooses the base hue and each property's random value.
#   Mode: Black / Dark / Midtone / Light / White.
# Mode filename values set Auto Colors separately from semantic text colors.
# filename_selection_offset is signed, in lightness points; it moves the
# selected-row background toward the surface from the filename color.
#   Vibrance: 0–100; 50 uses the recipe's saturation, 0 is grayscale.
#   Dynamics: 1–100; opens each property's random range from zero to full width.
#   Color Shift: 0–359 degrees; rotates the whole generated palette afterward.
#
# Each property has an independent, uniform random value keyed by seed,
# color name and component. Adding/reordering colors does not reshuffle others.
# Adjusting other controls keeps those random choices fixed.
# There are no periods, phases or seed-dependent tame/wild cycles.

[response]
# Normalized Dynamics: (value - 1) / 99, raised to this power.
# 1 gives a linear response. Larger values open ranges more slowly at first.
dynamics_exponent = 1.0
# Saturation multiplier: (Vibrance / 50) raised to this power.
vibrance_exponent = 1.5

# Lightness spread scales color lightness offsets and random ranges,
# retaining independent saturation and hue variation. 1 uses the full spread.
[modes.Black]
background = 8
text = 96
direction = 1
filename = 55
filename_selection_offset = -16
lightness_spread = 0.35
# Anchor accents independently of the near-black surface; their random ranges
# still use lightness_spread. Omit to inherit their normal color rules.
selection_lightness = 40
edge_lightness = 70

[modes.Dark]
background = 25
text = 94
direction = 1
filename = 65
filename_selection_offset = -16
lightness_spread = 1.0

[modes.Midtone]
background = 42
text = 98
direction = 1
filename = 80
filename_selection_offset = -16
lightness_spread = 1.0

[modes.Light]
background = 88
text = 18
direction = -1
filename = 36
filename_selection_offset = 16
lightness_spread = 1.0

[modes.White]
background = 98
text = 10
direction = -1
filename = 31
filename_selection_offset = 20
lightness_spread = 0.35

# Color rules:
#   base: another color, mode_background, or mode_text.
#   mode_background has the mode's lightness, zero saturation and seeded hue.
#   mode_text has the mode's text lightness, zero saturation and the SAME hue.
#   Omitted colors retain their current palette values and can serve as bases.
#   Dependencies resolve independently of table order; cycles are invalid.
#
# Each component supports:
#   center: absolute baseline; omitted means inherit the base's coordinate.
#   offset: fixed adjustment to that baseline; omitted means zero.
#   range: [minimum, maximum] random adjustment AT MAXIMUM Dynamics.
#          Omitted means [0, 0]. Both endpoints scale with Dynamics.
#
# Example: center=7, range=[-5, 15] gives saturation 7 at minimum Dynamics,
#          and a seeded value between 2 and 22 at maximum Dynamics.
#
# For lightness, mode direction multiplies BOTH offset and random adjustment.
# Positive adjustments therefore point toward text in every mode.
# The mode lightness_spread scales both offsets and random adjustments.
# Explicit centers remain absolute. Saturation/hue have no mode direction.
# L/S are clamped to 0–100 and hue wraps around the wheel.
# Resolve all bases before applying Vibrance and Color Shift, so neither
# modifier compounds down an inheritance chain.
# The generated palette stays unchanged by contrast guards. Displayed text is
# resolved separately against its actual background. Text selection keeps that
# text color and gently corrects its background within display-policy limits.
# Dynamics controls permitted differences; it does not force large differences.

[colors.background]
base = "mode_background"
lightness.range = [-8, 10]
saturation.center = 7
saturation.range = [-5, 15]
# The shared seeded hue already chooses the color family.
# No extra hue randomness is needed for this anchor color.

[colors.alt_background]
base = "background"
lightness.offset = 4
lightness.range = [-10, 16]
saturation.range = [-5, 10]
hue.range = [-80, 80]

[colors.border]
base = "background"
lightness.offset = 20
lightness.range = [-8, 15]
saturation.center = 25
saturation.range = [-10, 25]
hue.range = [-60, 60]

[colors.edge]
base = "background"
lightness.offset = 32
lightness.range = [-10, 15]
saturation.center = 65
saturation.range = [-20, 30]
hue.range = [-120, 120]

[colors.selection]
base = "background"
lightness.offset = 16
lightness.range = [-6, 16]
saturation.center = 35
saturation.range = [-15, 35]
hue.range = [-120, 120]

[colors.text_selection]
base = "selection"
# Stay closer to the editor surface and less saturated than file selection.
lightness.offset = -6
lightness.range = [-2, 2]
saturation.center = 12
saturation.range = [-4, 4]
hue.range = [-30, 30]

[colors.text]
base = "mode_text"
lightness.range = [-30, 6]
saturation.center = 5
saturation.range = [-5, 85]
hue.range = [-120, 120]

[colors.secondary_text]
base = "text"
# lightness.offset = -12
lightness.range = [-20, 20]
saturation.range = [-35, 65]
hue.range = [-280, 280]

# Semantic colors start from conventional absolute hues rather than seeded hue.
# Color Shift rotates these too, keeping its whole-palette behavior consistent.
[colors.error]
base = "mode_text"
lightness.offset = -12
lightness.range = [-8, 4]
saturation.center = 75
saturation.range = [-15, 20]
hue.center = 25
hue.range = [-180, 180]

[colors.info]
base = "mode_text"
lightness.offset = -12
lightness.range = [-8, 4]
saturation.center = 65
saturation.range = [-15, 25]
hue.center = 255
hue.range = [-180, 180]

[colors.success]
base = "mode_text"
lightness.offset = -12
lightness.range = [-8, 4]
saturation.center = 65
saturation.range = [-15, 25]
hue.center = 145
hue.range = [-180, 180]

[colors.warning]
base = "mode_text"
lightness.offset = -12
lightness.range = [-8, 4]
saturation.center = 75
saturation.range = [-15, 20]
hue.center = 80
hue.range = [-180, 180]

# Filename appearance uses the existing shared controls, without randomization.
[files]
# Vibrance scales saturation from this midpoint, with a separate upper limit
# to keep filenames below full gamut even at high Vibrance.
saturation = 74
saturation_max = 93
cut_offset = 20
hidden_offset = 6
dotfile_offset = 3
